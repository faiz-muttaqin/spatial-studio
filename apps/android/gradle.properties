org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Studio origin the WebView loads and the bridge trusts. Override with
# ./gradlew -PstudioOrigin=https://example.com :app:assembleDebug
studioOrigin=https://spatial-studio.faizmuttaqin.com
# Extra origin trusted by debug builds only. Must be a loopback host
# (localhost, 127.0.0.1) or the emulator host alias 10.0.2.2.
devOrigin=http://localhost:3002
